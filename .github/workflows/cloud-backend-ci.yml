name: Phoenix Cloud API CI

on:
  push:
    branches: [web]
    paths:
      - "cloud_backend/**"
      - "web_client/**"
      - "render.yaml"
      - "tests/test_cloud_backend.py"
      - "requirements-cloud.txt"
      - ".github/workflows/cloud-backend-ci.yml"
  pull_request:
    branches: [web]
    paths:
      - "cloud_backend/**"
      - "tests/test_cloud_backend.py"
      - "requirements-cloud.txt"
      - ".github/workflows/cloud-backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt
      - name: Install cloud API dependencies
        run: python -m pip install -r requirements-cloud.txt
      - name: Run cloud API tests
        run: python -m pytest -q tests/test_cloud_backend.py
